name: Send availability alerts

# Runs after every availability scan (chained via workflow_run) and can be
# triggered manually for testing. Kept separate from the scan so alerts can be
# re-run on the latest committed report without re-scraping the whole roster.
on:
  workflow_run:
    workflows: ["Daily oTENTik Availability Scan"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    # On the chained path only notify when the scan succeeded (a failed scan
    # leaves a stale report); a manual dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Send availability alerts
        run: python notify.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

      - name: Commit alert state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add alerts_state.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update alert state - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        shell: bash
