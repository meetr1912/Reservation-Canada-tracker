name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
  # Redeploy after each daily scan finishes. The scan commits the new data
  # with GITHUB_TOKEN, and token-pushed commits do NOT trigger `push`
  # workflows — so without this the site would never pick up fresh data.
  workflow_run:
    workflows: ["Daily oTENTik Availability Scan"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-flight deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # For workflow_run, only deploy when the scan succeeded. For all other
    # triggers (push, manual), always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify availability report exists
        run: |
          if [ ! -f "public/availability_report.json" ]; then
            echo "Error: availability_report.json not found in public folder!"
            echo "Creating empty report as fallback..."
            echo '{}' > public/availability_report.json
          fi
          echo "Availability report size: $(wc -c < public/availability_report.json) bytes"

      - name: Build React app
        run: npm run build
        env:
          CI: false

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
