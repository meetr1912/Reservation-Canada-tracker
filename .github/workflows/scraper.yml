name: Daily oTENTik Availability Scan

on:
  schedule:
    # Run every 4 hours so newly-freed sites are caught quickly.
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps

      - name: Run availability scan
        run: python scraper.py

      - name: Send availability alerts
        run: python notify.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add availability_report.json public/availability_report.json
          [ -f alerts_state.json ] && git add alerts_state.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update availability report - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        shell: bash
