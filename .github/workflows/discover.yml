name: Discover accommodations roster

on:
  schedule:
    # Refresh the national roster monthly (1st of the month, 03:17 UTC),
    # in case Parks Canada adds locations/units or changes resource IDs.
    - cron: '17 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Install Playwright
        run: |
          playwright install chromium
          playwright install-deps
      - name: Build national roster
        run: python discover.py
      - name: Commit roster
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add resources.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update accommodations roster - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        shell: bash
