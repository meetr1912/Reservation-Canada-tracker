# Evaluate the text-to-SQL agent with NeMo Agent Toolkit's eval harness.
#
#   pip install "nvidia-nat[langchain,eval,profiler]" langgraph
#   nat eval --config_file nemo-sql-agent/configs/eval.yml
#   nat eval --config_file nemo-sql-agent/configs/eval.yml --reps 3   # variance
#
# Scoring uses our custom `sql_execution_accuracy` evaluator (run-and-compare),
# which is the metric that matters for SQL — the built-in RAG evaluators score
# text answers, not query correctness. We also track latency and token cost so
# the optimizer can trade accuracy against efficiency.

general:
  telemetry:
    tracing:
      langsmith:
        _type: langsmith
        project: otentik-text-to-sql-eval

llms:
  sql_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 1024

workflow:
  _type: text_to_sql_agent
  llm_name: sql_llm
  db_path: nemo-sql-agent/data/otentiks.db
  use_schema_linking: true
  num_few_shot: 3
  use_cot: true
  max_corrections: 2
  self_consistency_n: 1

eval:
  general:
    output_dir: ./.tmp/nat/otentik_text_to_sql/eval
    verbose: true
    dataset:
      _type: json
      file_path: nemo-sql-agent/data/nat_eval_dataset.json
      id_key: id
      structure:
        question_key: question
        answer_key: gold_sql   # the evaluator treats this as the GOLD query
    # Profiler surfaces bottlenecks, token usage, and latency forecasts.
    profiler:
      compute_llm_metrics: true
      workflow_runtime_forecast: true
      token_uniqueness_forecast: true
      bottleneck_analysis:
        enable_nested_stack: true
  evaluators:
    execution_accuracy:
      _type: sql_execution_accuracy
      db_path: nemo-sql-agent/data/otentiks.db
    latency:
      _type: avg_llm_latency
    token_efficiency:
      _type: avg_tokens_per_llm_end
