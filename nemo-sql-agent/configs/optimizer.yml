# Self-improvement: let NeMo Agent Toolkit's optimizer SEARCH for the best
# combination of proven techniques instead of hand-tuning them.
#
#   pip install "nvidia-nat[langchain,eval,profiler]" nvidia-nat-config-optimizer
#   nat optimize --config_file nemo-sql-agent/configs/optimizer.yml
#
# The optimizer runs trials over the `search_space` below, scoring each trial
# with the same eval harness, and keeps the configuration on the Pareto front
# of (accuracy up, tokens down, latency down). This is the automated version of
# the ablation ladder in docs/GUIDE.md — the toolkit finds the compounding
# combination for you and reports the marginal value of each switch.

general:
  telemetry:
    tracing:
      langsmith:
        _type: langsmith
        project: otentik-text-to-sql-optimize

llms:
  sql_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 1024
    optimizable_params:
      - temperature
      - model_name
    search_space:
      temperature:
        values: [0.0, 0.3, 0.6]
      model_name:
        values:
          - meta/llama-3.3-70b-instruct
          - nvidia/nemotron-3-super-120b-a12b

workflow:
  _type: text_to_sql_agent
  llm_name: sql_llm
  db_path: nemo-sql-agent/data/otentiks.db
  use_schema_linking: true
  num_few_shot: 3
  use_cot: true
  max_corrections: 2
  self_consistency_n: 1
  optimizable_params:
    - use_schema_linking
    - use_cot
    - num_few_shot
    - max_corrections
    - self_consistency_n
  search_space:
    use_schema_linking:
      values: [true, false]
    use_cot:
      values: [true, false]
    num_few_shot:
      values: [0, 1, 3, 5]      # guide shows EX peaks near 3
    max_corrections:
      values: [0, 1, 2, 3]
    self_consistency_n:
      values: [1, 3, 5]

eval:
  general:
    output_dir: ./.tmp/nat/otentik_text_to_sql/optimize
    dataset:
      _type: json
      file_path: nemo-sql-agent/data/nat_eval_dataset.json
      id_key: id
      structure:
        question_key: question
        answer_key: gold_sql
  evaluators:
    execution_accuracy:
      _type: sql_execution_accuracy
      db_path: nemo-sql-agent/data/otentiks.db
    latency:
      _type: avg_llm_latency
    token_efficiency:
      _type: avg_tokens_per_llm_end

optimizer:
  output_path: ./.tmp/nat/otentik_text_to_sql/optimizer/
  reps_per_param_set: 1
  eval_metrics:
    execution_accuracy:
      evaluator_name: execution_accuracy
      direction: maximize
    token_efficiency:
      evaluator_name: token_efficiency
      direction: minimize
    latency:
      evaluator_name: latency
      direction: minimize
  numeric:
    enabled: true
    n_trials: 24
  prompt:
    # GA-based prompt evolution is available; our agent builds prompts
    # internally, so we optimize the technique switches numerically instead.
    enabled: false
