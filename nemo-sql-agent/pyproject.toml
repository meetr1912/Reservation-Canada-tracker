[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-sql-agent"
version = "0.1.0"
description = "Self-improving text-to-SQL agent (NeMo Agent Toolkit + LangGraph + LangSmith) over Parks Canada oTENTik availability data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
# Install with the toolkit to run via `nat`:
#   pip install -e ".[nat]"
nat = [
    "nvidia-nat[langchain,eval,profiler]",
    "nvidia-nat-config-optimizer",
]
nim = ["langchain-nvidia-ai-endpoints>=0.3"]

# The NeMo Agent Toolkit discovers components (functions, evaluators) by
# importing the module named in this entry-point group. Importing
# `nemo_sql_agent.register` runs the @register_function / @register_evaluator
# decorators. (Group name follows the current `nat.*` namespace; on older AIQ
# releases this group was `aiq.components`.)
[project.entry-points."nat.components"]
nemo_sql_agent = "nemo_sql_agent.register"

[tool.setuptools.packages.find]
where = ["src"]
